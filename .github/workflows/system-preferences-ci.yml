name: System Preferences CI

# Validates the curated production System Preferences catalog and behavioral-evidence policy.
on:
  push:
    branches:
      - main
      - feat/system-optimization-aa
    paths:
      - GatePass/Features/SystemPreferences/**
      - Tests/SystemPreferencesCoreTests.swift
      - .github/workflows/system-preferences-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - GatePass/Features/SystemPreferences/**
      - Tests/SystemPreferencesCoreTests.swift
      - .github/workflows/system-preferences-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-15
          - macos-26
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Compile System Preferences regression suite
        run: |
          xcrun swiftc -parse-as-library \
            Tests/SystemPreferencesCoreTests.swift \
            GatePass/Features/SystemPreferences/SystemPreferenceModels.swift \
            GatePass/Features/SystemPreferences/SystemPreferenceMetadata.swift \
            GatePass/Features/SystemPreferences/MacSystemPreferencesCatalog.swift \
            GatePass/Features/SystemPreferences/SystemDefaultsClient.swift \
            GatePass/Features/SystemPreferences/SystemPreferencesEngine.swift \
            -o /tmp/system-preferences-core-tests

      - name: Run System Preferences regression suite
        run: /tmp/system-preferences-core-tests
