name: Release GatePass

on:
  push:
    branches:
      - main
    paths:
      - VERSION
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create or update the v<VERSION> GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Package GatePass
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use semantic versioning, for example 0.1.0. Got: $VERSION" >&2
            exit 1
          fi

          TAG="v$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($TAG)." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Install DMG tooling
        run: brew install create-dmg

      - name: Build release app
        run: >-
          xcodebuild
          -project GatePass.xcodeproj
          -scheme "GatePass - Release"
          -configuration Release
          -sdk macosx
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          MARKETING_VERSION=${{ steps.version.outputs.version }}
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package ZIP, DMG, and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/GatePass.app"
          RELEASE_DIR="$RUNNER_TEMP/release"

          test -d "$APP"
          mkdir -p "$RELEASE_DIR"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RELEASE_DIR/GatePass.zip"
          script/build_dmg.sh "$APP" "$VERSION" "$RELEASE_DIR"

          (
            cd "$RELEASE_DIR"
            shasum -a 256 GatePass.zip "GatePass-$VERSION.dmg" > SHA256SUMS
          )

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: GatePass-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GatePass ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release/GatePass.zip
            ${{ runner.temp }}/release/GatePass-${{ steps.version.outputs.version }}.dmg
            ${{ runner.temp }}/release/SHA256SUMS
