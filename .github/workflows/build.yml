name: Release GatePass

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package GatePass
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve immutable release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use semantic versioning, for example 0.2.3. Got: $VERSION" >&2
            exit 1
          fi

          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Release builds must be triggered by the exact VERSION tag ($TAG). Got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Tag $TAG resolves to $TAG_COMMIT but the workflow is building $GITHUB_SHA." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Refuse mutable releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. GatePass releases are immutable; bump VERSION and create a new tag." >&2
            exit 1
          fi

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Run updater regression suite
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library \
            Tests/GatePassUpdaterTests.swift \
            GatePass/Utilities/GatePassUpdater.swift \
            -o "$RUNNER_TEMP/gatepass-updater-tests"
          "$RUNNER_TEMP/gatepass-updater-tests"

      - name: Install DMG tooling
        run: brew install create-dmg

      - name: Build release app
        run: >-
          xcodebuild
          -project GatePass.xcodeproj
          -scheme "GatePass - Release"
          -configuration Release
          -sdk macosx
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          MARKETING_VERSION=${{ steps.version.outputs.version }}
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package ZIP, DMG, and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/GatePass.app"
          RELEASE_DIR="$RUNNER_TEMP/release"

          test -d "$APP"
          mkdir -p "$RELEASE_DIR"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RELEASE_DIR/GatePass.zip"
          script/build_dmg.sh "$APP" "$VERSION" "$RELEASE_DIR"

          (
            cd "$RELEASE_DIR"
            shasum -a 256 GatePass.zip "GatePass-$VERSION.dmg" > SHA256SUMS
          )

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GatePass-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DIR: ${{ runner.temp }}/release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "$RELEASE_DIR/GatePass.zip" \
            "$RELEASE_DIR/GatePass-$VERSION.dmg" \
            "$RELEASE_DIR/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "GatePass $VERSION" \
            --generate-notes
